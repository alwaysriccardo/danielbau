<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANIELBAU | Innenausbau & Renovierung</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Preload Critical Images for Faster Loading - All Service Images -->
    <link rel="preload" as="image" href="/images/hero-hardwood.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/bathroom-tiling.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-2.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-2-1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-3.gif" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-4.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/interior-4-1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo.png" fetchpriority="high" />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --c-bg: #E3E1DC;
        --c-dark: #121212;
        --c-accent: #374336;
        --font-display: 'Syncopate', sans-serif;
        --font-body: 'Manrope', sans-serif;
      }
      body {
        background-color: var(--c-bg);
        color: var(--c-dark);
        font-family: var(--font-body);
        margin: 0;
        overflow-x: hidden;
      }
      
      /* Prevent flash of content before preloader */
      body:not(.loaded) {
        overflow: hidden !important;
        background-color: #000; /* Black background during preloader */
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }
      
      body.loaded {
        background-color: var(--c-bg);
        transition: none; /* Remove transition to prevent white flash */
        position: static;
        width: auto;
        height: auto;
      }
      
      /* Ensure scroll position stays at top */
      html, body {
        scroll-behavior: auto;
      }
      
      /* Prevent scroll jumps */
      html {
        scroll-padding-top: 0;
      }
      .font-display { font-family: var(--font-display); }
      .font-body { font-family: var(--font-body); }
      
      /* Lenis Recommended Styles */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }


      /* Performance Optimizations for Smooth Scrolling */
      .card-inner {
        will-change: transform, opacity;
        transform: translate3d(0,0,0);
        backface-visibility: hidden;
        perspective: 1000px;
      }
      
      .hero-text-line,
      .hero-fade {
        will-change: transform, opacity;
        transform: translate3d(0,0,0);
        backface-visibility: hidden;
      }
      
      /* Optimize all animated elements */
      img, video {
        transform: translate3d(0,0,0);
        backface-visibility: hidden;
      }
      
      /* Optimize smooth scrolling elements */
      [data-lenis-prevent] {
        will-change: scroll-position;
      }

      /* Cross-browser compatibility and optimizations */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        box-sizing: border-box;
      }
      
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Fix for Safari/WebKit */
      @supports (-webkit-appearance: none) {
        body {
          -webkit-font-smoothing: antialiased;
          -webkit-tap-highlight-color: transparent;
        }
      }

      /* Fix for Firefox */
      @-moz-document url-prefix() {
        body {
          font-smoothing: antialiased;
        }
      }

      /* Fix for Edge/Chrome */
      @supports (-ms-ime-align: auto) {
        body {
          -ms-font-feature-settings: "liga" 1;
        }
      }
      
      /* GPU acceleration for better performance */
      .preloader-container,
      .hero-text-line,
      .hero-fade,
      .card-inner {
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        perspective: 1000px;
        -webkit-perspective: 1000px;
      }
      
      /* Fix for iframe pointer events in various browsers */
      iframe {
        pointer-events: auto !important;
      }
      
      /* Better touch handling for mobile */
      @media (hover: none) and (pointer: coarse) {
        button, a {
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
        }
      }

      /* Ensure smooth scrolling works across browsers */
      html {
        scroll-behavior: smooth;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }

      /* Reduce motion for users who prefer it */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
