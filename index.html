<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANIELBAU | Innenausbau & Renovierung</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --c-bg: #E3E1DC;
        --c-dark: #121212;
        --c-accent: #374336;
        --font-display: 'Syncopate', sans-serif;
        --font-body: 'Manrope', sans-serif;
      }
      body {
        background-color: var(--c-bg);
        color: var(--c-dark);
        font-family: var(--font-body);
        margin: 0;
        overflow-x: hidden;
      }
      
      /* Prevent flash of content before preloader */
      body:not(.loaded) {
        overflow: hidden !important;
        background-color: #000; /* Black background during preloader */
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }
      
      body.loaded {
        background-color: var(--c-bg);
        transition: background-color 0.3s ease;
        position: static;
        width: auto;
        height: auto;
      }
      
      /* Ensure scroll position stays at top */
      html, body {
        scroll-behavior: auto;
      }
      
      /* Prevent scroll jumps */
      html {
        scroll-padding-top: 0;
      }
      .font-display { font-family: var(--font-display); }
      .font-body { font-family: var(--font-body); }
      
      /* Lenis Recommended Styles */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }

      /* Noise Overlay */
      .noise-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9000;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      /* Performance Optimizations */
      .card-inner {
        will-change: transform, opacity;
      }
      
      .hero-text-line,
      .hero-fade {
        will-change: transform, opacity, text-shadow;
      }

      /* Reduce motion for users who prefer it */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <div class="noise-overlay"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
